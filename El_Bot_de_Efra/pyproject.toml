[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "el_bot_de_efra"
version = "1.0.0"
description = "🤖 Bot de trading inteligente con IA, estrategias técnicas, Telegram, backtesting y Streamlit"
readme = "README.md"
license = "MIT"
authors = [
  { name="Efraín Sarmiento", email="efraneo@gmail.com" }
]
requires-python = ">=3.9"

dependencies = [
  "streamlit>=1.35.0",
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "scikit-learn>=1.4.1",
  "yfinance>=0.2.36",
  "python-telegram-bot==13.15",
  "python-dotenv>=1.0.1",
  "plotly>=5.22.0",
  "matplotlib>=3.9.0",
  "tqdm>=4.66.4",
  "ta>=0.11.0"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/efrain-sarmiento/el_bot_de_efra"
Repository = "https://github.com/efrain-sarmiento/el_bot_de_efra"

[project.scripts]
bot-efra = "el_bot_de_efra:ejecutar_bot"
